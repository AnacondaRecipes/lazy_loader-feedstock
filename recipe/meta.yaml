{% set name = "lazy_loader" %}
{% set version = "0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: 2f4b7824d6401958639008a0cae20c776b61dff619accd6890693e2de8260167

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=61.2
  run:
    - python
    - packaging

test:
  source_files:
    - tests
  imports:
    - lazy_loader
  requires:
    - pip
    - pytest >=8.0
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://scientific-python.org/specs/spec-0001
  summary: Easily load subpackages and functions on demand
  dev_url: https://github.com/scientific-python/lazy_loader
  license: BSD-3-Clause
  license_file: LICENSE.md
  license_family: BSD
  description: |
    'lazy-loader' makes it easy to load subpackages and functions on demand.
  doc_url: https://github.com/scientific-python/lazy_loader

extra:
  recipe-maintainers:
    - sugatoray
    - bmcfee
